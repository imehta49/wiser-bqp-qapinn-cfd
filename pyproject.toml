[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiser-qapinn-cfd"
version = "0.1.0"
description = "Classical and quantum-assisted PINNs with explainability studies for PDEs and CFD."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "psutil>=5.9",
  "torch>=2.2"
]

[project.optional-dependencies]
quantum = ["pennylane>=0.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
